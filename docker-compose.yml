version: '3.8'

services:
  # ============================================
  # DATABASES
  # ============================================

  mongo:
    image: mongo:7.0
    container_name: solea-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rootpassword}
    volumes:
      - mongo_data:/data/db
    networks:
      - solea-network

  redis:
    image: redis:7-alpine
    container_name: solea-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - solea-network

  neo4j:
    image: neo4j:5-community
    container_name: solea-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-password123}
    volumes:
      - neo4j_data:/data
    networks:
      - solea-network

  # ============================================
  # MICROSERVICES
  # ============================================

  legacy-backend:
    build:
      context: ./solea-backend
      dockerfile: Dockerfile
    container_name: solea-legacy-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      MONGO_URI: ${MONGO_URI:-mongodb://root:rootpassword@mongo:27017/solea?authSource=admin}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password123}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      - mongo
      - redis
      - neo4j
    networks:
      - solea-network

  # MS-2: Auth Service
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: solea-auth-service
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      MONGO_URI: ${MONGO_URI:-mongodb://root:rootpassword@mongo:27017/solea?authSource=admin}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
    depends_on:
      - mongo
    networks:
      - solea-network

  # MS-2: Users Service
  users-service:
    build:
      context: ./services/users-service
      dockerfile: Dockerfile
    container_name: solea-users-service
    restart: unless-stopped
    ports:
      - "4002:4002"
    environment:
      PORT: 4002
      MONGO_URI: ${MONGO_URI:-mongodb://root:rootpassword@mongo:27017/solea?authSource=admin}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
    depends_on:
      - mongo
    networks:
      - solea-network

  # MS-1: Recommendation Service
  recommendation-service:
    build:
      context: ./services/recommendation-service
      dockerfile: Dockerfile
    container_name: solea-recommendation-service
    restart: unless-stopped
    ports:
      - "4005:4005"
    environment:
      PORT: 4005
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password123}
    depends_on:
      - neo4j
    networks:
      - solea-network

  # MS-1: Cache Service
  cache-service:
    build:
      context: ./services/cache-service
      dockerfile: Dockerfile
    container_name: solea-cache-service
    restart: unless-stopped
    ports:
      - "4006:4006"
    environment:
      PORT: 4006
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      - redis
    networks:
      - solea-network

  # API Gateway (BFF)
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: solea-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      LEGACY_BACKEND_URL: http://legacy-backend:4000
      AUTH_SERVICE_URL: http://auth-service:4001
      USERS_SERVICE_URL: http://users-service:4002
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:4005
      CACHE_SERVICE_URL: http://cache-service:4006
    depends_on:
      - legacy-backend
      - auth-service
      - users-service
      - recommendation-service
      - cache-service
    networks:
      - solea-network

# ============================================
# VOLUMES
# ============================================
volumes:
  mongo_data:
  redis_data:
  neo4j_data:

    # ============================================
    # NETWORKS
    # ============================================
networks:
  solea-network:
    driver: bridge
